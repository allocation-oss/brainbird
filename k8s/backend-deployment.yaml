apiVersion: apps/v1
kind: Deployment
metadata:
  name: brainbird-backend
  namespace: brainbird
  labels:
    app: brainbird-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: brainbird-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: brainbird-backend
    spec:
      containers:
        - name: api
          image: brainbird-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: http
          envFrom:
            - configMapRef:
                name: brainbird-config
            - secretRef:
                name: brainbird-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8081
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
