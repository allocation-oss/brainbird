<style>
  /* Global Glassmorphic Foundation & Modern Typography */
  body {
    background: radial-gradient(circle at 15% 15%, rgba(241, 245, 249, 0.9) 0%, rgba(248, 250, 252, 0.98) 45%, rgba(239, 246, 255, 0.7) 100%) !important;
    background-attachment: fixed !important;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .app-header {
    position: sticky;
    z-index: 1020;
    top: 0;
    min-height: 64px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    padding: 10px 24px;
    background: rgba(255, 255, 255, 0.82) !important;
    backdrop-filter: blur(24px) saturate(190%) !important;
    -webkit-backdrop-filter: blur(24px) saturate(190%) !important;
    border-bottom: 1px solid rgba(226, 232, 240, 0.8) !important;
    box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.04), inset 0 -1px 0 rgba(255, 255, 255, 0.8);
  }
  .page-heading { min-width: 0; }
  .page-heading .eyebrow {
    margin: 0 0 2px;
    color: var(--brand, #2563eb);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
  }
  .page-heading h1 {
    margin: 0;
    font-size: 18px;
    line-height: 1.25;
    font-weight: 700;
    color: var(--text-dark, #0f172a);
    letter-spacing: -0.2px;
  }
  .header-actions {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .profile {
    display: flex;
    align-items: center;
    gap: 10px;
    padding-left: 12px;
    border-left: 1px solid rgba(226, 232, 240, 0.8);
  }
  .profile-avatar {
    width: 36px;
    height: 36px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    color: #fff;
    background: linear-gradient(135deg, rgba(37, 99, 235, 0.95), rgba(29, 78, 216, 0.95)) !important;
    backdrop-filter: blur(8px) !important;
    font-weight: 700;
    font-size: 14px;
    box-shadow: 0 3px 10px rgba(37, 99, 235, 0.35), inset 0 1px 1px rgba(255, 255, 255, 0.4);
    border: 1px solid rgba(255, 255, 255, 0.3);
  }
  .profile-copy {
    display: flex;
    flex-direction: column;
    line-height: 1.2;
  }
  .profile-name {
    display: block;
    font-weight: 700;
    font-size: 12px;
    color: var(--text-dark, #0f172a);
  }
  .profile-role {
    display: block;
    color: var(--text-muted, #64748b);
    font-size: 11px;
    font-weight: 500;
  }
  .icon-button, .secondary-button {
    min-height: 34px;
    border: 1px solid rgba(226, 232, 240, 0.8) !important;
    border-radius: 9px;
    background: rgba(255, 255, 255, 0.75) !important;
    backdrop-filter: blur(10px) !important;
    -webkit-backdrop-filter: blur(10px) !important;
    color: var(--text-dark, #0f172a);
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 6px rgba(15, 23, 42, 0.03);
  }
  .icon-button {
    width: 34px;
  }
  .secondary-button {
    padding: 0 12px;
    font-weight: 600;
    font-size: 12px;
    gap: 6px;
  }
  .icon-button:hover, .secondary-button:hover {
    border-color: rgba(37, 99, 235, 0.3) !important;
    background: rgba(239, 246, 255, 0.85) !important;
    color: var(--brand, #2563eb) !important;
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.15) !important;
    transform: translateY(-1px);
  }

  /* Universal Glass Table Styling */
  .table-scroll, .workload-table, table {
    background: transparent !important;
  }
  table thead th {
    background: rgba(248, 250, 252, 0.85) !important;
    backdrop-filter: blur(10px) !important;
    -webkit-backdrop-filter: blur(10px) !important;
    border-bottom: 1px solid rgba(226, 232, 240, 0.8) !important;
  }
  table tbody tr:hover td {
    background: rgba(239, 246, 255, 0.45) !important;
  }
</style>

<header class="app-header">
  <div class="page-heading">
    <p class="eyebrow" id="headerEyebrow">Operations overview</p>
    <h1 id="headerTitle">Operations Portal</h1>
  </div>
  <div class="header-actions">
    <button class="icon-button" id="refreshDashboard" type="button" title="Refresh" onclick="window.location.reload()">
      <i class="fa-solid fa-rotate"></i>
    </button>
    <div class="profile">
      <span class="profile-avatar" id="profileAvatar">B</span>
      <div class="profile-copy">
        <span class="profile-name" id="profileName">Admin</span>
        <span class="profile-role" id="profileRole">Administrator</span>
      </div>
    </div>
    <button class="secondary-button" id="logoutButton" type="button" title="Sign out" onclick="logoutApp()">
      <i class="fa-solid fa-arrow-right-from-bracket"></i> Sign out
    </button>
  </div>
</header>

<script>
(function () {
  var path = window.location.pathname.toLowerCase();
  var hTitle = document.getElementById('headerTitle');
  var hEye = document.getElementById('headerEyebrow');
  
  if (hTitle) {
    if (path.includes('matrix') || path.includes('cases/add') || path.includes('cases/edit') || path.includes('case/edit')) {
      hTitle.textContent = 'Case Matrix Form';
      if (hEye) hEye.textContent = 'Data Entry & Profiling';
    } else if (path.includes('master_edit')) {
      hTitle.textContent = 'Master Case Edit Console';
      if (hEye) hEye.textContent = 'Case Administration';
    } else if (path.includes('case_reset')) {
      hTitle.textContent = 'Case Reset & Purge';
      if (hEye) hEye.textContent = 'Workflow Operations';
    } else if (path.includes('rework')) {
      hTitle.textContent = 'Rework Cases Console';
      if (hEye) hEye.textContent = 'Quality Assurance';
    } else if (path.includes('case_cleanup') || path.includes('trash')) {
      hTitle.textContent = 'Case Dustbin & Trash';
      if (hEye) hEye.textContent = 'Administrative Cleanup';
    } else if (path.includes('export_data') || path.includes('export')) {
      hTitle.textContent = 'Export Data Hub';
      if (hEye) hEye.textContent = 'Reporting & Analytics';
    } else if (path.includes('dispatch')) {
      hTitle.textContent = 'Document Dispatch Console';
      if (hEye) hEye.textContent = 'Logistics & Verification';
    } else if (path.includes('attendance')) {
      hTitle.textContent = 'Attendance System';
      if (hEye) hEye.textContent = 'Staff Matrix';
    } else if (path.includes('users/manage')) {
      hTitle.textContent = 'User Manager';
      if (hEye) hEye.textContent = 'Access & Accounts';
    } else if (path.includes('allocation_manager')) {
      hTitle.textContent = 'Allocation Manager';
      if (hEye) hEye.textContent = 'Workflow Distribution';
    } else if (path.includes('id_generator')) {
      hTitle.textContent = 'ID Card Generator';
      if (hEye) hEye.textContent = 'Identity Management';
    } else if (path.includes('staff_mapping')) {
      hTitle.textContent = 'Staff Mapping Console';
      if (hEye) hEye.textContent = 'Geo-Coverage Assignment';
    } else if (path.includes('points_setup')) {
      hTitle.textContent = 'Points Setup Console';
      if (hEye) hEye.textContent = 'Incentives & Performance';
    } else if (path.includes('forensic')) {
      hTitle.textContent = 'Forensic Analytics Engine';
      if (hEye) hEye.textContent = 'Anti-Fraud Intelligence';
    } else if (path.includes('analytics')) {
      hTitle.textContent = 'Analytics Hub';
      if (hEye) hEye.textContent = 'Executive Insights';
    } else if (path.includes('reports')) {
      hTitle.textContent = 'Performance Reports';
      if (hEye) hEye.textContent = 'Operational Audits';
    } else if (path.includes('payout')) {
      hTitle.textContent = 'Payout Verification';
      if (hEye) hEye.textContent = 'Billing & Disbursements';
    } else if (path.includes('letters')) {
      hTitle.textContent = 'Letters & Templates';
      if (hEye) hEye.textContent = 'Document Automation';
    } else if (path.includes('locations')) {
      hTitle.textContent = 'Location Master';
      if (hEye) hEye.textContent = 'Coverage Geo-Hierarchy';
    } else if (path.includes('menu_manager')) {
      hTitle.textContent = 'Menu Architecture & Modules';
      if (hEye) hEye.textContent = 'System Navigation';
    } else if (path.includes('permission_manager')) {
      hTitle.textContent = 'Permissions Matrix';
      if (hEye) hEye.textContent = 'Role Governance';
    } else if (path.includes('audit_logs')) {
      hTitle.textContent = 'Audit Trail & Logs';
      if (hEye) hEye.textContent = 'System Security';
    } else if (path.includes('tracking')) {
      hTitle.textContent = 'Location Tracking Matrix';
      if (hEye) hEye.textContent = 'Live Field Telemetry';
    } else if (path.includes('dashboard')) {
      hTitle.textContent = 'Operations Dashboard';
      if (hEye) hEye.textContent = 'Overview & Metrics';
    }
  }

  var roleMap = {
    1: 'Super Admin',
    2: 'Admin',
    3: 'Case Manager',
    4: 'Allocation Manager',
    5: 'Back Office',
    6: 'Field Officer',
    7: 'Area Manager'
  };

  fetch('/api/v1/dashboard/layout')
    .then(function(res) { return res.json(); })
    .then(function(data) {
      if (data && data.userProfile) {
        var p = data.userProfile;
        var nameEl = document.getElementById('profileName');
        var roleEl = document.getElementById('profileRole');
        var avatarEl = document.getElementById('profileAvatar');
        
        var name = p.fullname || p.username || 'User';
        if (nameEl) nameEl.textContent = name;
        if (roleEl) roleEl.textContent = roleMap[p.role_id] || ('Role ' + p.role_id);
        if (avatarEl) {
          avatarEl.textContent = name.charAt(0).toUpperCase();
        }
      }
    })
    .catch(function() {});
})();

function logoutApp() {
  document.cookie = "brainbird_session=; path=/; expires=Thu, 01 Jan 1970 00:00:00 UTC;";
  window.location.href = '/login';
}
</script>
