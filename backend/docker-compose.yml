services:
  mariadb:
    image: mariadb:11
    container_name: brainbird-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: brainbird
      MARIADB_DATABASE: brainbir1_brainbird_local
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: brainbird-redis
    ports:
      - "6379:6379"

  kafka:
    image: bitnami/kafka:3.8
    container_name: brainbird-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    container_name: brainbird-phpmyadmin
    depends_on:
      - mariadb
    ports:
      - "8082:80"
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      UPLOAD_LIMIT: 128M

volumes:
  mariadb_data:
